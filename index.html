<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สมุดเมนู</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#d9c9a8;--page:#f3e8cf;--ink:#2b1f15;--muted:#7a6650;--tile:#241b15;--frame:#7a5632;--accent:#b5651d;--line:#cdb990;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130f;--page:#26352c;--ink:#efe6cf;--muted:#a7b3a0;--tile:#1a1511;--frame:#6b4a2f;--accent:#e8b94a;--line:#3d5144;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17130f;--page:#26352c;--ink:#efe6cf;--muted:#a7b3a0;--tile:#1a1511;--frame:#6b4a2f;--accent:#e8b94a;--line:#3d5144;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Noto Sans Thai','Sarabun',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px 12px 88px}
h1,h2,.cap{font-family:'Mali','Noto Sans Thai',system-ui,sans-serif}
.book{width:100%;max-width:820px;background:var(--page);border:10px solid var(--frame);border-radius:6px;box-shadow:0 14px 40px rgba(0,0,0,.35);padding:22px 20px 26px;min-height:70vh}
.cover{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:62vh;gap:14px}
.cover h1{font-size:clamp(44px,12vw,92px);margin:0;letter-spacing:.02em;line-height:1.15}
.cover .sub{font-size:18px;color:var(--muted);max-width:30ch;margin:0}
.cover .strip{display:flex;gap:6px;margin:10px 0}.cover .strip img{width:64px;height:60px;object-fit:cover;border-radius:6px;background:var(--tile)}
.btn{font:inherit;background:var(--accent);color:#1d140c;border:0;border-radius:8px;padding:12px 22px;font-weight:600;cursor:pointer;min-height:44px}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:2px dashed var(--line);padding-bottom:10px;margin-bottom:16px}
h2{font-size:clamp(22px,5vw,32px);margin:0;outline-offset:4px}
.cnt{color:var(--muted);font-size:14px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px 12px}
.item{display:flex;flex-direction:column;gap:6px;min-width:0}
.item .tile{background:var(--tile);border-radius:8px;overflow:hidden;line-height:0;border:2px solid var(--frame)}
.item img{width:100%;aspect-ratio:88/80;object-fit:cover;image-rendering:pixelated}
.nm{font-size:15px;font-weight:600;min-height:1.5em;padding:2px 4px;border-radius:4px;overflow-wrap:anywhere}
.nm:empty::before{content:attr(data-ph);color:var(--muted);font-weight:400}
.nm:hover{background:color-mix(in srgb,var(--accent) 16%,transparent)}
[contenteditable]:focus-visible,.btn:focus-visible,.nav button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.no{font-size:12px;color:var(--muted);padding:0 4px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;align-items:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.nav button{font:inherit;min-width:52px;min-height:44px;border-radius:8px;border:2px solid var(--frame);background:var(--page);color:var(--ink);cursor:pointer;font-size:18px}
.nav button:disabled{opacity:.4;cursor:default}
.nav span{min-width:90px;text-align:center;font-size:14px;color:var(--muted)}
.hint{margin-top:18px;font-size:13px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:no-preference){.book.turn{animation:turn .22s ease-out}@keyframes turn{from{opacity:.2;transform:translateX(var(--dx,14px))}to{opacity:1;transform:none}}}
</style></head><body>
<main class="book" id="book"></main>

const pages=Math.ceil(IMGS.length/PER);
let cur=0,names={},titles={};
try{names=JSON.parse(localStorage.getItem('menu-names')||'{}');titles=JSON.parse(localStorage.getItem('menu-titles')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('menu-names',JSON.stringify(names));localStorage.setItem('menu-titles',JSON.stringify(titles))}catch(e){}};
const book=document.getElementById('book');
function render(dir){
  book.className='book';void book.offsetWidth;book.style.setProperty('--dx',(dir<0?-14:14)+'px');
  if(cur===0){
    book.innerHTML='<section class="cover"><h1 class="cap">สมุดเมนู</h1><p class="sub">รวมอาหาร '+IMGS.length+' อย่าง พิมพ์ชื่อเมนูใต้รูปได้เลย</p><div class="strip">'+[2,9,21,40,66].map(i=>'<img alt="" src="'+IMGS[i]+'">').join('')+'</div><button class="btn" id="open">เปิดดูเมนู</button></section>';
    document.getElementById('open').onclick=()=>go(1);
  }else{
    const s=(cur-1)*PER,list=IMGS.slice(s,s+PER);
    book.innerHTML='<div class="head"><h2 contenteditable="plaintext-only" data-k="'+cur+'" spellcheck="false"></h2><span class="cnt">รายการที่ '+(s+1)+'–'+(s+list.length)+'</span></div><div class="grid">'+list.map((src,j)=>'<div class="item"><div class="tile"><img alt="เมนูรายการที่ '+(s+j+1)+'" src="'+src+'"></div><div class="nm" contenteditable="plaintext-only" spellcheck="false" data-id="'+(s+j)+'" data-ph="ตั้งชื่อเมนู"></div><div class="no">'+String(s+j+1).padStart(3,'0')+'</div></div>').join('')+'</div><p class="hint">แตะที่ชื่อเพื่อแก้ไข ระบบจะจำไว้ในเบราว์เซอร์นี้</p>';
    const h=book.querySelector('h2');h.textContent=titles[cur]||('หมวดที่ '+cur);
    h.oninput=()=>{titles[cur]=h.textContent;save()};
    book.querySelectorAll('.nm').forEach(el=>{el.textContent=names[el.dataset.id]||'';el.oninput=()=>{names[el.dataset.id]=el.textContent;save()};el.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();el.blur()}}});
  }
  book.classList.add('turn');
  document.getElementById('pos').textContent=cur===0?'ปก':'หน้า '+cur+' / '+pages;
  document.getElementById('prev').disabled=cur===0;document.getElementById('next').disabled=cur===pages;
  window.scrollTo(0,0);
}
function go(n,fromHash){n=Math.max(0,Math.min(pages,n));const d=n-cur;cur=n;render(d);if(!fromHash){try{history.replaceState(null,'',n?'#p'+n:'#cover')}catch(e){}}}
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{if(e.target.isContentEditable)return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
const fromHash=()=>{const m=/^#p(\d+)$/.exec(location.hash);cur=-1;go(m?+m[1]:0,true)};
window.addEventListener('hashchange',fromHash);fromHash();
</script></body></html>
